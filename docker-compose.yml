services:
  traefik-internal:
    image: traefik:v3.6
    container_name: traefik-internal-${COMPOSE_PROJECT_NAME}
    restart: always
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=private-network-${COMPOSE_PROJECT_NAME}"
      # Filtro para leer solo apps internas
      - "--providers.docker.constraints=Label(`traefik.tier`,`internal`)"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      # Proveedor de archivos dinámico (Certificados mkcert en local)
      - "--providers.file.filename=/etc/traefik/dynamic-conf.yml"
      - "--providers.file.watch=true"
      # Resolver de Let's Encrypt (Producción / En línea)
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@ideasfarm.com}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./certs:/certs:ro
      - ./dynamic-conf.yml:/etc/traefik/dynamic-conf.yml:ro
      - ./letsencrypt:/letsencrypt
    networks:
      global-transit-network: {}
      private-network:
        aliases:
          - dev.${CLIENT_DOMAIN}
          - alpha.${CLIENT_DOMAIN}
          - beta.${CLIENT_DOMAIN}
          - ${CLIENT_DOMAIN}
          - dev-login.${CLIENT_DOMAIN}
          - alpha-login.${CLIENT_DOMAIN}
          - beta-login.${CLIENT_DOMAIN}
          - login.${CLIENT_DOMAIN}
          - dev-app.${CLIENT_DOMAIN}
          - alpha-app.${CLIENT_DOMAIN}
          - beta-app.${CLIENT_DOMAIN}
          - app.${CLIENT_DOMAIN}
    labels:
      - "traefik.enable=true"
      - "traefik.tier=global" # Se anuncia al líder global
      # Router HTTP (Puerto 80) para tráfico/redirección (Dominio raíz y subdominios)
      - "traefik.http.routers.router-http-${COMPOSE_PROJECT_NAME}.rule=Host(`${CLIENT_DOMAIN}`) || HostRegexp(`^[a-z0-9-]+\\.${CLIENT_DOMAIN}$`)"
      - "traefik.http.routers.router-http-${COMPOSE_PROJECT_NAME}.entrypoints=web"
      - "traefik.http.services.router-http-${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=80"
      # Router TCP TLS Passthrough (Puerto 443) para pasar TLS sin descifrar
      - "traefik.tcp.routers.router-https-${COMPOSE_PROJECT_NAME}.rule=HostSNI(`${CLIENT_DOMAIN}`) || HostSNIRegexp(`^[a-z0-9-]+\\.${CLIENT_DOMAIN}$`)"
      - "traefik.tcp.routers.router-https-${COMPOSE_PROJECT_NAME}.entrypoints=websecure"
      - "traefik.tcp.routers.router-https-${COMPOSE_PROJECT_NAME}.tls.passthrough=true"
      - "traefik.tcp.routers.router-https-${COMPOSE_PROJECT_NAME}.service=service-https-${COMPOSE_PROJECT_NAME}"
      - "traefik.tcp.services.service-https-${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=443"
      - "traefik.docker.network=global-transit-network"

  mysql:
    image: mysql:8.0
    container_name: mysql-${COMPOSE_PROJECT_NAME}
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    networks:
      - private-network

  mongodb:
    image: mongo:7.0
    container_name: mongodb-${COMPOSE_PROJECT_NAME}
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-demo}
    volumes:
      - mongo-data:/data/db
    networks:
      private-network:
        aliases:
          - dev-gramedia.${CLIENT_DOMAIN}

  redis:
    image: redis:7.0-alpine
    container_name: redis-${COMPOSE_PROJECT_NAME}
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-demo}
    volumes:
      - redis-data:/data
    networks:
      - private-network

networks:
  global-transit-network:
    external: true
  private-network:
    name: private-network-${COMPOSE_PROJECT_NAME}

volumes:
  mysql-data:
  mongo-data:
  redis-data:
