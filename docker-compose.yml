services:
  traefik-internal:
    image: traefik:v3.6
    container_name: traefik-internal-${COMPOSE_PROJECT_NAME}
    restart: always
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=private-network-${COMPOSE_PROJECT_NAME}"
      # NUEVO: Filtro para leer solo apps internas
      - "--providers.docker.constraints=Label(`traefik.tier`,`internal`)"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - global-transit-network
      - private-network
    labels:
      - "traefik.enable=true"
      - "traefik.tier=global"
      # Route all subdomains of this client here
      - "traefik.http.routers.router-${COMPOSE_PROJECT_NAME}.rule=HostRegexp(`^[a-z0-9-]+\\.${CLIENT_DOMAIN}$`)"
      # NUEVO: Escuchar en puerto seguro y habilitar TLS
      - "traefik.http.routers.router-${COMPOSE_PROJECT_NAME}.entrypoints=websecure"
      - "traefik.http.routers.router-${COMPOSE_PROJECT_NAME}.tls=true"
      - "traefik.http.routers.router-${COMPOSE_PROJECT_NAME}.tls.certresolver=${CERT_RESOLVER:-}"
      - "traefik.http.services.router-${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=80"
      - "traefik.docker.network=global-transit-network"

networks:
  global-transit-network:
    external: true
  private-network:
    name: private-network-${COMPOSE_PROJECT_NAME}
